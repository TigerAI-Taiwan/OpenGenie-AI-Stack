services:
  mosquitto:
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:latest}
    container_name: mosquitto
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t healthcheck/ping -m ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "1883:1883"
    networks:
      - ai_stack_net
    volumes:
      - ${BASE_DIR:-/home/wrt/TigerAI}/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ${BASE_DIR:-/home/wrt/TigerAI}/mosquitto/data:/mosquitto/data
      - ${BASE_DIR:-/home/wrt/TigerAI}/mosquitto/log:/mosquitto/log
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  docling:
    image: ${DOCLING_IMAGE:-ghcr.io/docling-project/docling-serve-cu128:latest}
    container_name: docling-nvidia
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    ports:
      - "${HTTP_DOCLING_PORT:-5001}:5001"
    networks:
      - ai_stack_net
    shm_size: ${DOCLING_SHM:-16gb}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${BASE_DIR:-/home/wrt/TigerAI}/docling:/app/data
    environment:
      - DOCLING_SERVE_MAX_SYNC_WAIT=9000
      - DOCLING_SERVE_ENABLE_UI=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: qdrant-nvidia
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    networks:
      - ai_stack_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${BASE_DIR:-/home/wrt/TigerAI}/qdrant:/qdrant/storage
    environment:
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=${QDRANT_MAX_THREADS:-4}
      - QDRANT__STORAGE__PERFORMANCE__OPTIMIZER_MAX_THREADS=4
      - QDRANT__GPU__INDEXING=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai_stack_net:
    external: true
