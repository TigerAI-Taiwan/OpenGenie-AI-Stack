# =====================================================================
# TigerAI RAG Stack — nvidia overlay
# Path: deployments/compose-stack/05-rag-stack-docling-qdrant-mosquitto/docker-compose.nvidia.yaml
#
# Differences from base:
#   1. GPU access for docling and qdrant: deploy.resources.reservations
#      (driver: nvidia).
#   2. docling image: the CUDA 13.0 build.
#   3. qdrant image: the NVIDIA GPU build.
# =====================================================================
services:
  docling:
    # cu130 publishes no `latest` tag, so this must stay pinned. The same pin
    # also lives in .env.nvidia.example, which overrides this default.
    image: ${DOCLING_IMAGE:-ghcr.io/docling-project/docling-serve-cu130:v1.30.0}
    environment:
      # Bare key: absent when deploy.sh does not set it. `${TIGER_CPU_THREADS:-}`
      # would inject an empty string, which libgomp rejects outright.
      - OMP_NUM_THREADS
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:gpu-nvidia-latest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
