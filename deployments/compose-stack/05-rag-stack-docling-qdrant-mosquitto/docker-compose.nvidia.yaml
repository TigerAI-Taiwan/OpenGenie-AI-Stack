# =====================================================================
# TigerAI RAG Stack — nvidia overlay
# Path: deployments/compose-stack/05-rag-stack-docling-qdrant-mosquitto/docker-compose.nvidia.yaml
#
# Differences from base:
#   1. GPU access for docling and qdrant: deploy.resources.reservations
#      (driver: nvidia).
#   2. docling image: the CUDA 13.0 build.
#   3. qdrant image: the NVIDIA GPU build.
# =====================================================================
services:
  docling:
    # WARNING: cu130 publishes NO `latest` tag (only vX.Y.Z), so this default
    # must stay a pinned version. Keep it in sync with deploy.sh's
    # pull_docling_image, which pre-pulls the same ref.
    image: ${DOCLING_IMAGE:-ghcr.io/docling-project/docling-serve-cu130:v1.30.0}
    environment:
      # Bare key (no `=`): the value comes from deploy.sh's environment, and the
      # variable is simply absent when it is not set there. `${TIGER_CPU_THREADS:-}`
      # would inject an EMPTY string instead, and libgomp rejects that with
      # "Invalid value" rather than falling back to its default.
      - OMP_NUM_THREADS
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:gpu-nvidia-latest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
