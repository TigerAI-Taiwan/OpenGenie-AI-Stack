# =====================================================================
# TigerAI mosquitto configuration
# Path: deployments/compose-stack/05-rag-stack-docling-qdrant-mosquitto/resource/_shared/mosquitto.conf
#
# Mounted read-only and selected explicitly by the container command
# (`mosquitto -c ...`). The broker previously ran on a config that deploy.sh
# generated on the host with `allow_anonymous true` and no password file —
# anyone who could reach port 1883 could publish and subscribe, while the
# healthcheck passed credentials that were never checked.
#
# No acl_file: every account here is a stack-internal publisher, and there is
# no untrusted party to partition topics against.
# =====================================================================

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

listener 1883
allow_anonymous false
password_file /mosquitto/config/password.file
