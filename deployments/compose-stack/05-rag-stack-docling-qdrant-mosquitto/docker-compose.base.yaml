# =====================================================================
# TigerAI RAG Stack (Docling / Qdrant / Mosquitto) — base
# Path: deployments/compose-stack/05-rag-stack-docling-qdrant-mosquitto/docker-compose.base.yaml
#
# Every platform difference lives in docker-compose.<platform>.yaml:
#   docling image      nvidia: docling-serve-cu128   amd / arm64: docling-serve-cpu
#   qdrant image       nvidia: gpu-nvidia-latest     amd: gpu-amd-latest   arm64: latest
#   GPU access         amd: devices /dev/kfd + /dev/dri + Vulkan ICD mounts
#                      nvidia / arm64: deploy.resources.reservations
#
# WARNING: base deliberately carries NO GPU mount, for the same reason as
# 03-ai-interface: if base declared nvidia's reservation, the amd overlay
# would need `!reset` to remove it and an AMD machine would be left with a
# stray `driver: nvidia` reservation.
# =====================================================================
services:
  mosquitto:
    # The amd stack called this MQTT_IMAGE and the others MOSQUITTO_IMAGE.
    # MOSQUITTO_IMAGE is the name here; the amd overlay keeps MQTT_IMAGE
    # working so existing amd .env files are not silently ignored.
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:latest}
    container_name: mosquitto
    restart: always
    healthcheck:
      # The credentials here must match the ones the command block above feeds
      # to mosquitto_passwd — same defaults, same variables.
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -u ${MQTT_USERNAME:-tigerai} -P ${MQTT_PASSWORD:-CHANGE_ME} -t healthcheck/ping -m ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      # arm64 alone made this configurable; adopted for all three.
      - "${MOSQUITTO_PORT:-1883}:1883"
    networks:
      - ai_stack_net
    # amd and arm64 had this, nvidia did not. Harmless where unused, and it is
    # what lets the broker reach services on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./resource/_shared/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${BASE_DIR:-/home/wrt/TigerAI}/mosquitto/data:/mosquitto/data
      - ${BASE_DIR:-/home/wrt/TigerAI}/mosquitto/log:/mosquitto/log
    # The password file is generated inside the container at start-up, because
    # mosquitto_passwd lives in the image and the hash must match the broker's
    # version. It is written to /mosquitto/config, which is NOT a mounted
    # volume, so the credentials never touch the host filesystem.
    #
    # WARNING: `command` is replaced wholesale by an overlay, never merged. Any
    # overlay that sets command here must repeat all of this.
    command: >
      sh -c "touch /mosquitto/config/password.file &&
             mosquitto_passwd -b /mosquitto/config/password.file '${MQTT_USERNAME:-tigerai}' '${MQTT_PASSWORD:-CHANGE_ME}' &&
             exec mosquitto -c /mosquitto/config/mosquitto.conf"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  docling:
    # Overridden by every overlay — there is no image that works on all three.
    image: ${DOCLING_IMAGE:-ghcr.io/docling-project/docling-serve-cpu:latest}
    container_name: docling
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    ports:
      - "${HTTP_DOCLING_PORT:-5001}:5001"
    networks:
      - ai_stack_net
    # nvidia used DOCLING_SHM, arm64 used SHM_SIZE_RAG. DOCLING_SHM is the name
    # here; the arm64 overlay keeps the old one working.
    shm_size: ${DOCLING_SHM:-16gb}
    volumes:
      - ${BASE_DIR:-/home/wrt/TigerAI}/docling:/app/data
    environment:
      - OCR_STRATEGY=auto
      - DOCLING_SERVE_MAX_SYNC_WAIT=9000
      - DOCLING_SERVE_ENABLE_UI=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  qdrant:
    # Overridden by every overlay — the GPU build differs per vendor.
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: qdrant
    restart: always
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    networks:
      - ai_stack_net
    volumes:
      - ${BASE_DIR:-/home/wrt/TigerAI}/qdrant:/qdrant/storage
    environment:
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=${QDRANT_MAX_THREADS:-4}
      - QDRANT__STORAGE__PERFORMANCE__OPTIMIZER_MAX_THREADS=4
      # Kept on all three platforms, matching the pre-merge files. On arm64
      # there is no official aarch64 GPU image, so this is silently ignored and
      # Qdrant falls back to CPU indexing.
      - QDRANT__GPU__INDEXING=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ai_stack_net:
    external: true
