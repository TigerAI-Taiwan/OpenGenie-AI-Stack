# =====================================================================
# TigerAI AI Core — Ollama arm64 overlay
# Path: deployments/compose-stack/03-ai-core/ollama/docker-compose.arm64.yaml
#
# Differences from base:
#   1. ollama GPU access: deploy.resources.reservations (driver: nvidia).
# =====================================================================
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
