# =====================================================================
# TigerAI Lemonade AI Core — containerized (AMD Vulkan)
# Path: deployments/compose-stack/06-ai-core-lemonade/docker-compose.base.yaml
#
# WARNING: this file is used by the amd platform ONLY.
#
# Lemonade is deployed on amd alone, as the three containers below (Vulkan via
# /dev/kfd + /dev/dri). On nvidia and arm64 the LLM inference path is Ollama in
# 03-ai-interface: deploy.sh logs that the module does not apply and exits 0
# before reaching tiger_compose, which is why master-deploy.sh can keep this
# module in DEPLOY_STEPS on every platform.
#
# There is no overlay for this module because there is nothing to overlay.
#
# GPU access: /dev/kfd + /dev/dri device mounts (no ROCm runtime needed).
#
# tiger-mode: EDU is the default; RAG and EMBED are mutually exclusive.
#   Switch to RAG:   deploy.sh rag
#   Switch to EDU:   deploy.sh edu
#
# NOTE: the YAML anchor below is fine because it is used within this single
# file. Anchors do not cross compose files — if this module ever gains an
# overlay, any service that overlay adds must carry its own logging block.
# =====================================================================

x-lemonade-base: &lemonade-base
  image: ghcr.io/lemonade-sdk/lemonade-server:v11.9.0
  # The v11 image runs as `USER lemonade` (uid 10001), but /var/cache/lemonade is
  # a named volume whose mount point Docker creates as root. Non-root cannot write
  # config.json there, `set -e` exits, and every container CrashLoops.
  # Cost: the containers run as root, with /dev/kfd and /dev/dri mapped in. The
  # alternative, `chown -R 10001:10001` on the volume, was not chosen because it
  # rewrites existing volumes.
  user: "0:0"
  restart: always
  networks:
    - ai_stack_net
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "${TIGER_VIDEO_GID:-44}"
    - "${TIGER_RENDER_GID:-992}"
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  lemonade-edu:
    <<: *lemonade-base
    container_name: lemonade-edu
    ports:
      - "8800:8800"
    environment:
      LEMONADE_API_KEY: ${LEMONADE_API_KEY}
      GGML_VK_VISIBLE_DEVICES: ${GGML_VK_VISIBLE_DEVICES_EDU:-0}
      CACHE_DIR: /var/cache/lemonade
      TIGER_CPU_THREADS: ${TIGER_CPU_THREADS:-16}
    volumes:
      - ${MODELS_DIR:-/home/wrt/TigerAI/models}:/models:ro
      - lemonade-edu-cache:/var/cache/lemonade
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p "$$CACHE_DIR"
        THREADS=$${TIGER_CPU_THREADS:-16}
        # parallel 2 gives each slot 65536 tokens. Matches lemonade-rag below.
        cat > "$$CACHE_DIR/config.json" << EOF
        {
          "config_version": 1,
          "ctx_size": 131072,
          "extra_models_dir": "/models",
          "llamacpp": {
            "args": "--threads $$THREADS --parallel 2 --cache-type-k q8_0 --cache-type-v q8_0",
            "backend": "vulkan"
          }
        }
        EOF
        # v11 added a config_dir positional argument (lemond [cache_dir] [config_dir]).
        # Given only cache_dir, config_dir follows it; it is passed explicitly
        # here so this does not rely on that implicit derivation.
        exec /opt/lemonade/lemond "$$CACHE_DIR" "$$CACHE_DIR" --port 8800 --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8800/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  lemonade-rag:
    <<: *lemonade-base
    container_name: lemonade-rag
    ports:
      - "8801:8801"
    environment:
      LEMONADE_API_KEY: ${LEMONADE_API_KEY}
      GGML_VK_VISIBLE_DEVICES: ${GGML_VK_VISIBLE_DEVICES_RAG:-0}
      CACHE_DIR: /var/cache/lemonade
      TIGER_CPU_THREADS: ${TIGER_CPU_THREADS:-16}
    volumes:
      - ${MODELS_DIR:-/home/wrt/TigerAI/models}:/models:ro
      - lemonade-rag-cache:/var/cache/lemonade
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p "$$CACHE_DIR"
        THREADS=$${TIGER_CPU_THREADS:-16}
        cat > "$$CACHE_DIR/config.json" << EOF
        {
          "config_version": 1,
          "ctx_size": 131072,
          "extra_models_dir": "/models",
          "llamacpp": {
            "args": "--threads $$THREADS --parallel 2 --cache-type-k q8_0 --cache-type-v q8_0",
            "backend": "vulkan"
          }
        }
        EOF
        exec /opt/lemonade/lemond "$$CACHE_DIR" "$$CACHE_DIR" --port 8801 --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8801/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  lemonade-embed:
    <<: *lemonade-base
    container_name: lemonade-embed
    ports:
      - "8802:8802"
    environment:
      LEMONADE_API_KEY: ${LEMONADE_API_KEY}
      GGML_VK_VISIBLE_DEVICES: ${GGML_VK_VISIBLE_DEVICES_EMBED:-0}
      CACHE_DIR: /var/cache/lemonade
      TIGER_CPU_THREADS: ${TIGER_CPU_THREADS:-16}
    volumes:
      - ${MODELS_DIR:-/home/wrt/TigerAI/models}:/models:ro
      - lemonade-embed-cache:/var/cache/lemonade
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p "$$CACHE_DIR"
        # Half, so embed does not contend with edu/rag. The floor of 1 matters:
        # llama.cpp reads --threads 0 as "auto-detect" and takes every core.
        THREADS=$$(( $${TIGER_CPU_THREADS:-16} / 2 ))
        [ "$$THREADS" -lt 1 ] && THREADS=1
        cat > "$$CACHE_DIR/config.json" << EOF
        {
          "config_version": 1,
          "ctx_size": 8192,
          "extra_models_dir": "/models",
          "llamacpp": {
            "args": "--threads $$THREADS --embedding",
            "backend": "vulkan"
          }
        }
        EOF
        exec /opt/lemonade/lemond "$$CACHE_DIR" "$$CACHE_DIR" --port 8802 --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8802/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  lemonade-edu-cache:
  lemonade-rag-cache:
  lemonade-embed-cache:

networks:
  ai_stack_net:
    external: true
